name: Build Helium TV Browser APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK & SDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Set up Rust Toolchain (TV ARM Targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust Native Library for Android TV
        run: |
          mkdir -p app/src/main/jniLibs
          cd app/src/main/rust
          cargo ndk -t arm64-v8a -t armeabi-v7a -o ../jniLibs build --release

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Build Optimized TV APKs with Gradle (<50MB)
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APKs to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HeliumTV-Browser-Optimized-APKs
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
