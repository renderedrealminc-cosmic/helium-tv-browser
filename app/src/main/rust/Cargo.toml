[package]
name = "helium-adblock"
version = "0.1.0"
edition = "2021"
authors = ["Helium TV Browser Team"]
description = "High-performance Rust Native Adblock & Content Filtering Engine for Helium TV Browser"

[lib]
name = "helium_adblock"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21.1", default-features = false }
regex = { version = "1.10.4", default-features = false, features = ["std", "unicode-case"] }
serde = { version = "1.0.197", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0.115", default-features = false, features = ["alloc"] }
once_cell = "1.19.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
